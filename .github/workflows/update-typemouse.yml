# Manual fallback: sets Casks/typemouse.rb to the latest TypeMouse release.
# The TypeMouse release workflow normally updates the cask itself.
# Run it with: gh workflow run update-typemouse.yml --repo fsargent/homebrew-tap
name: Update TypeMouse

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update the cask to the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release view --repo fsargent/typemouse --json tagName --jq .tagName)
          version="${tag#v}"
          current=$(sed -n 's/^  version "\(.*\)"$/\1/p' Casks/typemouse.rb)
          if [ "$version" = "$current" ]; then
            echo "Already on $version."
            exit 0
          fi
          sha=$(gh release download "$tag" --repo fsargent/typemouse \
            --pattern "TypeMouse-$version.zip.sha256" --output - | awk '{print $1}')
          sed -i "s/^  version \".*\"$/  version \"$version\"/; s/^  sha256 \".*\"$/  sha256 \"$sha\"/" Casks/typemouse.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "feat: update typemouse to $version"
          git push
